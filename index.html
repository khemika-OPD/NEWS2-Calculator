<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS 2 Calculator - โดย เขมิกา พงษ์ศรี</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; max-width: 450px; width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        
        .header { background: #0284c7; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 5px 0 0; opacity: 0.9; font-size: 12px; }
        
        .content { padding: 15px; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; display: block; width: 4px; height: 18px; background: #0284c7; border-radius: 2px; }

        .option-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .option-row:hover { background: #f8fafc; }
        .option-text { font-size: 14px; font-weight: 600; color: #334155; }
        
        /* สไตล์ป้ายคะแนนสีสันแบบเดิม */
        .score-box { font-size: 14px; font-weight: bold; color: white; padding: 4px 12px; border-radius: 6px; min-width: 25px; text-align: center; }
        .bg-red { background: #ef4444; }
        .bg-yellow { background: #eab308; }
        .bg-green { background: #10b981; }
        .bg-orange { background: #f97316; }

        .footer { padding: 15px; text-align: center; font-size: 11px; color: #64748b; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>NEWS 2 Calculator</h1>
        <p>OPD รพ.ตาคลี | เครื่องมือประเมินสัญญาณเตือนภัย</p>
    </div>

    <div class="content">
        <div class="section-title">1. อัตราการหายใจ (Respiratory Rate)</div>
        
        <div class="option-row" onclick="select(this)">
            <span class="option-text">≤ 8 ครั้ง/นาที</span>
            <span class="score-box bg-red">3</span>
        </div>
        <div class="option-row" onclick="select(this)">
            <span class="option-text">9 - 11 ครั้ง/นาที</span>
            <span class="score-box bg-yellow">1</span>
        </div>
        <div class="option-row" onclick="select(this)">
            <span class="option-text">12 - 20 ครั้ง/นาที</span>
            <span class="score-box bg-green">0</span>
        </div>
        <div class="option-row" onclick="select(this)">
            <span class="option-text">21 - 24 ครั้ง/นาที</span>
            <span class="score-box bg-orange">2</span>
        </div>
        <div class="option-row" onclick="select(this)">
            <span class="option-text">≥ 25 ครั้ง/นาที</span>
            <span class="score-box bg-red">3</span>
        </div>
    </div>

    <div class="footer">
        พัฒนาโดย <span style="color:#0284c7; font-weight:bold;">Khemika-OPD Takhli</span>
    </div>
</div>

<script>
    function select(element) {
        document.querySelectorAll('.option-row').forEach(el => el.style.borderColor = '#e2e8f0');
        element.style.borderColor = '#0284c7';
    }
</script>

</body>
</html>
