<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS 2 Calculator - โดย เขมิกา พงษ์ศรี</title>
    <style>
        :root {
            --primary-blue: #0284c7;
            --bg-gray: #f1f5f9;
            --text-dark: #1e293b;
            
            /* Severity Colors */
            --c-normal: #10b981; /* เขียว */
            --c-low: #eab308;    /* เหลือง */
            --c-med: #f97316;    /* ส้ม */
            --c-high: #ef4444;   /* แดง */
        }

        *, *::before, *::after { box-sizing: border-box; }

        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-gray); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            background: white; 
            max-width: 450px; 
            width: 100%; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05); 
            border: 1px solid #e2e8f0; 
        }
        
        .header { 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            padding: 22px 15px; 
            text-align: center; 
        }
        .header h1 { margin: 0; font-size: 22px; font-weight: bold; }
        .header p { margin: 4px 0 0; opacity: 0.9; font-size: 13px; }
        
        .content { padding: 20px; }
        
        .section-box {
            margin-bottom: 20px;
            background: #ffffff;
        }

        .section-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: var(--text-dark); 
            margin-bottom: 12px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: var(--primary-blue);
            border-radius: 2px;
        }

        /* Grid Layout สำหรับจัดเรียงแนวนอน ลดพื้นที่ว่าง */
        .options-grid {
            display: table;
            width: 100%;
            border-collapse: separate;
            border-spacing: 8px;
        }

        .grid-row {
            display: table-row;
        }

        /* Compact Card Style */
        .compact-card {
            display: table-cell;
            width: 50%;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 12px;
            vertical-align: middle;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .compact-card:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* เมื่อถูกกดเลือก */
        .compact-card.active {
            background: #f0f9ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .card-content {
            display: block;
            padding-right: 35px; /* เผื่อพื้นที่ให้ป้ายคะแนนขวา */
        }

        .option-desc {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            display: block;
        }

        /* ป้ายคะแนนขนาดเล็กกะทัดรัดที่มุมขวา */
        .score-indicator {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: bold;
            color: white;
            padding: 3px 8px;
            border-radius: 8px;
            text-align: center;
            min-width: 32px;
        }

        /* สีป้ายคะแนนตามระดับความเสี่ยง */
        .score-indicator.bg-normal { background-color: var(--c-normal); }
        .score-indicator.bg-low { background-color: var(--c-low); }
        .score-indicator.bg-med { background-color: var(--c-med); }
        .score-indicator.bg-high { background-color: var(--c-high); }

        .footer { 
            background: #f8fafc; 
            padding: 15px; 
            text-align: center; 
            font-size: 12px; 
            color: #64748b; 
            border-top: 1px solid #e2e8f0; 
        }
        .dev-name { color: var(--primary-blue); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>NEWS 2 Calculator</h1>
        <p>OPD รพ.ตาคลี | เครื่องมือประเมินสัญญาณเตือนภัย</p>
    </div>

    <div class="content">
        <div class="section-box">
            <div class="section-title">1. อัตราการหายใจ (Respiratory Rate)</div>
            
            <div class="options-grid">
                <div class="grid-row">
                    <div class="compact-card" onclick="selectOption(this, 3)">
                        <div class="card-content">
                            <span class="option-desc">≤ 8 ครั้ง/นาที</span>
                        </div>
                        <span class="score-indicator bg-high">3</span>
                    </div>
                    <div class="compact-card" onclick="selectOption(this, 1)">
                        <div class="card-content">
                            <span class="option-desc">9 - 11 ครั้ง/นาที</span>
                        </div>
                        <span class="score-indicator bg-low">1</span>
                    </div>
                </div>
                
                <div class="grid-row">
                    <div class="compact-card" onclick="selectOption(this, 0)">
                        <div class="card-content">
                            <span class="option-desc">12 - 20 ครั้ง/นาที</span>
                        </div>
                        <span class="score-indicator bg-normal">0</span>
                    </div>
                    <div class="compact-card" onclick="selectOption(this, 2)">
                        <div class="card-content">
                            <span class="option-desc">21 - 24 ครั้ง/นาที</span>
                        </div>
                        <span class="score-indicator bg-med">2</span>
                    </div>
                </div>
            </div>

            <div class="options-grid" style="margin-top: -4px;">
                <div class="grid-row">
                    <div class="compact-card" style="width: 100%;" onclick="selectOption(this, 3)">
                        <div class="card-content">
                            <span class="option-desc">≥ 25 ครั้ง/นาที</span>
                        </div>
                        <span class="score-indicator bg-high">3</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        พัฒนาโดย <span class="dev-name">Khemika-OPD Takhli</span>
    </div>
</div>

<script>
    function selectOption(element, score) {
        // หาพี่น้องร่วมกลุ่มใน Section นั้นๆ เพื่อลบคลาส active
        const section = element.closest('.section-box');
        const cards = section.querySelectorAll('.compact-card');
        cards.forEach(card => card.classList.remove('active'));
        
        // ไฮไลต์ใบที่ถูกเลือกปัจจุบัน
        element.classList.add('active');
        console.log("คะแนนที่เลือก:", score);
    }
</script>

</body>
</html>
