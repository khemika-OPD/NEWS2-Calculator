<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NEWS 2 Calculator - Complete Version</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; max-width: 450px; width: 100%; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; }
        .option-button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1.5px solid #ccc; cursor: pointer; text-align: center; font-weight: bold; }
        .btn-clear { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div id="steps-container">
        <!-- ตัวอย่างโครงสร้าง: พี่เขมิกาสามารถเพิ่ม step จนครบ 8 ข้อตาม image_189f57.png และ image_189f9d.png -->
        
        <div id="step1" class="step active">
            <h3>1. อัตราการหายใจ (RR)</h3>
            <div class="option-button" onclick="nextStep(3, 'step2')">≤ 8</div>
            <div class="option-button" onclick="nextStep(1, 'step2')">9-11</div>
            <div class="option-button" onclick="nextStep(0, 'step2')">12-20</div>
            <!-- เพิ่มตัวเลือกที่เหลือตามรูป -->
        </div>

        <div id="step2" class="step">
            <h3>2. เลือก SpO2 Scale</h3>
            <div class="option-button" onclick="nextStep(0, 'step3')">Scale 1 (คนไข้ทั่วไป)</div>
            <div class="option-button" onclick="nextStep(0, 'step3')">Scale 2 (COPD)</div>
        </div>

        <!-- พี่เขมิกาสามารถเพิ่ม step3 ถึง step8 ได้ตามรูปแบบนี้ -->
        
        <div id="result" class="step">
            <h3>คะแนนรวม: <span id="totalScore">0</span></h3>
            <p id="interpretation"></p>
            <button class="btn-clear" onclick="resetForm()">เริ่มประเมินใหม่</button>
        </div>
    </div>
</div>

<script>
    let totalScore = 0;
    function nextStep(score, nextId) {
        totalScore += score;
        document.querySelector('.step.active').classList.remove('active');
        document.getElementById(nextId).classList.add('active');
    }
    function resetForm() {
        totalScore = 0;
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step1').classList.add('active');
    }
</script>
</body>
</html>
